<style>
  .ck {
    position: fixed; z-index: 50; left: 50%; bottom: 16px;
    transform: translate(-50%, 140%);
    width: calc(100% - 32px); max-width: 560px;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 14px 14px 18px; border-radius: 18px;
    background: var(--surface, rgba(255,255,255,0.6));
    border: 1px solid var(--hairline, rgba(15,24,45,0.1));
    backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 18px 40px -18px rgba(15, 24, 45, 0.35);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: transform 0.55s cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark) { .ck { background: rgba(14, 20, 36, 0.82); } }
  @media (prefers-color-scheme: light) { .ck { background: rgba(255, 255, 255, 0.82); } }
  .ck.show { transform: translate(-50%, 0); }
  .ck-ico { font-size: 20px; line-height: 1; flex-shrink: 0; }
  .ck-txt { flex: 1; font-size: 12.5px; line-height: 1.55; color: var(--text-dim, #5c6c86); text-align: left; }
  .ck-txt b { color: var(--text, #0a1224); font-weight: 600; }
  .ck-txt a { color: var(--text-dim, #5c6c86); }
  .ck-btn {
    flex-shrink: 0; border: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
    color: #fff; padding: 10px 18px; border-radius: 100px;
    background: linear-gradient(135deg, var(--accent-1, #2563eb), var(--accent-3, #60a5fa));
  }
  .ck-btn:hover { filter: brightness(1.06); }
  .ck-btn:focus-visible { outline: 2px solid var(--accent-2, #3b82f6); outline-offset: 3px; }
  @media (max-width: 480px) {
    .ck { flex-wrap: wrap; bottom: 12px; }
    .ck-btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .ck { transition: none; } }
</style>
<div class="ck" id="ck" role="dialog" aria-live="polite" aria-label="Cookie">
  <span class="ck-ico" aria-hidden="true">🍪</span>
  <div class="ck-txt"><b>Мы не используем рекламные и отслеживающие cookie.</b>
    Cloudflare может сохранить технический cookie для защиты от ботов, а ваш выбор запоминается в браузере.
    <a href="/privacy#cookie">Подробнее</a></div>
  <button class="ck-btn" id="ckOk" type="button">Понятно</button>
</div>
<script>
(function () {
  var K = 'rds_cookie_ok', ok = false;
  try { ok = localStorage.getItem(K) === '1'; } catch (e) {}
  if (ok) { document.getElementById('ck').remove(); return; }
  var el = document.getElementById('ck');
  setTimeout(function () { el.classList.add('show'); }, 700);
  document.getElementById('ckOk').addEventListener('click', function () {
    try { localStorage.setItem(K, '1'); } catch (e) {}
    el.classList.remove('show');
    setTimeout(function () { el.remove(); }, 600);
  });
})();
</script>
